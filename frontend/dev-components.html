<!DOCTYPE html>
<!-- dev-components.html - 组件基座独立预览页（仅开发用，不参与构建，不进产物）
     用途：绕开主应用启动流程（纯浏览器下 Tauri 桥接为空会导致 main.js 中断），
     单独加载 Tailwind + 主题变量 + shadcn 组件，用于目测与验收。
     访问方式：npm run dev:web 后打开 http://localhost:1420/dev-components.html -->
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VersePC2 - 组件基座预览（仅开发用）</title>
  <!-- 复用真实主题变量，保证预览与应用的 token 环境一致 -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
  <style>
    body { padding: 24px; background: var(--bg-primary); color: var(--text-primary); }
    #preview { max-width: 1100px; }
    .vp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .vp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .vp-stack { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
    .vp-select { width: 220px; }
    .vp-skeleton { width: 100%; height: 16px; }
    .vp-themer { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 10; }
    .vp-themer button {
      padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer;
      background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="vp-themer">
    <button data-set-theme="light">亮色</button>
    <button data-set-theme="dark">暗色</button>
    <button data-set-theme="custom">自定义</button>
  </div>
  <div id="preview"></div>
  <script>
    document.querySelectorAll('.vp-themer button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.documentElement.dataset.theme = btn.dataset.setTheme;
      });
    });
  </script>
  <script type="module" src="/src/dev-components-entry.js"></script>
</body>
</html>
